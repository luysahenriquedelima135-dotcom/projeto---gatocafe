<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café & RonRon</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- MENU -->
  <nav class="navbar navbar-expand-lg menu-cafe">
    <div class="container">
      <a class="navbar-brand" href="#">🐱☕ Café & RonRon</a>
    </div>
  </nav>

  <!-- BANNER DO TOPO -->
  <header class="banner-topo text-center">
    <div class="container">
      <h1>Encontre seu novo melhor amigo</h1>
      <p class="lead">Preencha o cadastro abaixo para conhecer os gatinhos que esperam por um lar.</p>
    </div>
  </header>

  <!-- FORMULÁRIO -->
  <main class="container pb-5">
    <div class="card cartao-cafe shadow-lg">
      <div class="card-body p-4 p-md-5">
        <h2 class="mb-4">Cadastro de adotante</h2>

        <form id="formCadastro" novalidate>

          <h5 class="secao">Dados pessoais</h5>
          <div class="row g-3 mb-4">
            <div class="col-12">
              <label for="nome" class="form-label">Nome completo</label>
              <input type="text" id="nome" class="form-control" placeholder="Ex.: Maria da Silva">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6">
              <label for="nascimento" class="form-label">Data de nascimento</label>
              <input type="date" id="nascimento" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6">
              <label for="telefone" class="form-label">Telefone / WhatsApp</label>
              <input type="text" id="telefone" class="form-control" placeholder="(00) 00000-0000" maxlength="15">
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <h5 class="secao">Endereço</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label for="cep" class="form-label">CEP</label>
              <input type="text" id="cep" class="form-control" placeholder="00000-000" maxlength="9">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-8">
              <label for="rua" class="form-label">Rua</label>
              <input type="text" id="rua" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-3">
              <label for="numero" class="form-label">Número</label>
              <input type="text" id="numero" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-9">
              <label for="bairro" class="form-label">Bairro</label>
              <input type="text" id="bairro" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-8">
              <label for="cidade" class="form-label">Cidade</label>
              <input type="text" id="cidade" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-4">
              <label for="estado" class="form-label">Estado (UF)</label>
              <input type="text" id="estado" class="form-control" maxlength="2" placeholder="SP">
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termo">
            <label class="form-check-label" for="termo">
              Declaro que as informações são verdadeiras e me comprometo a cuidar bem do gatinho adotado.
            </label>
            <div class="invalid-feedback">Você precisa aceitar para continuar.</div>
          </div>

          <button type="submit" class="btn botao-cafe btn-lg w-100">Cadastrar e ver gatinhos 🐾</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 rodape-cafe">
    © 2026 Café & RonRon
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
